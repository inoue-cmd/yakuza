<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>架空組織図メーカー【任侠編】</title>
<style>
:root{
  --bg:#0b0c10;
  --panel:#14161f;
  --card:#1a1d26;
  --border:#2a2f3d;
  --gold:#d4af37;
  --crimson:#c0392b;
  --text:#f0eeeb;
  --muted:#8c93a3;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Meiryo",sans-serif;
  color:var(--text);
  background:var(--bg);
}
*{box-sizing:border-box}
body{margin:0;padding:12px;background-color:var(--bg)}
.app{max-width:800px;margin:auto}

/* ヘッダー */
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:8px}
h1{font-size:18px;margin:0;letter-spacing:0.08em;color:var(--gold)}
.sub{color:var(--muted);font-size:11px;margin-top:2px}

/* 共通パネル・ツールバー */
.toolbar,.panel,.org-switcher{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button, select{border:1px solid var(--border);background:#1e222d;color:var(--text);border-radius:6px;padding:8px 12px;cursor:pointer;font-size:13px;font-family:inherit;transition:0.1s}
button:hover, select:hover{background:#282e3d;border-color:var(--gold)}
select{padding:7px 10px;max-width:100%}
button:disabled{opacity:0.3;cursor:not-allowed}
button.primary{background:var(--crimson);color:#fff;border-color:#e74c3c;font-weight:bold}
button.primary:hover{background:#a93226}
button.danger{color:#ff8080;border-color:#5c282a}
button.danger:hover{background:#3d191b}

.org-switcher{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}

/* レイアウト：上から 組織選択 → ツールバー → 編集パネル → 組織図 */
.layout{display:flex;flex-direction:column;gap:10px}

/* 編集パネル */
label{display:block;font-size:11px;color:var(--gold);margin:8px 0 4px;font-weight:bold}
input{width:100%;padding:9px;border:1px solid var(--border);background:#0f1117;color:var(--text);border-radius:6px;font-size:14px}
input:focus{outline:none;border-color:var(--gold)}

/* キャンバス（通常表示エリア） */
.canvas-wrap{position:relative}
.canvas-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;color:var(--gold);gap:6px;flex-wrap:wrap}
.canvas{background:#0e1017;border:1px solid var(--border);border-radius:10px;min-height:350px;max-height:50vh;overflow:auto;position:relative;padding:20px;cursor:zoom-in}
.tree{display:flex;flex-direction:column;align-items:center;min-width:max-content;padding:20px;transform-origin:top center}

/* フルスクリーン・モーダル表示 */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:9999;flex-direction:column;padding:10px}
.modal-overlay.active{display:flex}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--panel);border-radius:8px 8px 0 0;border:1px solid var(--border);gap:6px;flex-wrap:wrap}
.modal-zoom-controls{display:flex;gap:4px;align-items:center}
.modal-zoom-controls button{padding:5px 10px;font-size:12px}
.modal-body{background:#0e1017;flex:1;overflow:auto;border:1px solid var(--border);border-top:0;border-radius:0 0 8px 8px;padding:30px;display:flex;justify-content:center;align-items:flex-start}

/* ツリーノードのデザイン */
.branch{display:flex;flex-direction:column;align-items:center;position:relative}
.node{min-width:150px;max-width:200px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);text-align:center;box-shadow:0 3px 8px rgba(0,0,0,0.4);cursor:pointer;position:relative;transition:0.15s}
.node:hover{border-color:var(--gold)}
.node.selected{outline:2px solid var(--crimson);border-color:var(--crimson);box-shadow:0 0 12px rgba(192,57,43,0.5)}
.node.root-node{border:2px solid var(--gold);background:linear-gradient(180deg,#221e15 100%,#15130e 0%);padding-top:14px}
.node.root-node::before{content:"◆ 本家 ◆";display:block;font-size:9px;color:var(--gold);letter-spacing:0.15em;margin-bottom:3px}

.node .role-badge{display:inline-block;font-size:10px;color:#fff;background:var(--crimson);padding:2px 6px;border-radius:3px;margin-bottom:4px;letter-spacing:0.05em;font-weight:bold}
.node.root-node .role-badge{background:var(--gold);color:#0f1117}
.node strong{display:block;font-size:14px;letter-spacing:0.05em;color:#fff;word-break:break-all}
.node small{display:block;color:var(--muted);margin-top:4px;font-size:11px;border-top:1px dashed var(--border);padding-top:4px;word-break:break-all}

/* 接続線 */
.connector{height:18px;border-left:1px solid var(--gold)}
.children{display:flex;justify-content:center;gap:16px;position:relative;padding-top:18px}
.children:before{content:"";position:absolute;top:0;left:50%;height:1px;width:calc(100% - 150px);transform:translateX(-50%);background:var(--gold)}
.children>.branch:before{content:"";position:absolute;top:0;height:18px;border-left:1px solid var(--gold)}
.children>.branch:first-child:after,.children>.branch:last-child:after{content:"";position:absolute;top:0;width:50%;border-top:1px solid var(--gold)}
.children>.branch:first-child:after{left:50%}
.children>.branch:last-child:after{right:50%}
.children>.branch:only-child:after{display:none}
.children>.branch .node{position:relative;z-index:1}

.status{font-size:11px;color:var(--gold);min-height:16px;margin-top:8px}
.meta-info{color:var(--muted);font-size:11px;margin-top:6px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="app">
<header>
<div>
<h1>架空組織図メーカー【任侠編】</h1>
<div class="sub">スマホ対応 / 自動保存</div>
</div>
<div class="toolbar no-print" style="margin:0;border:0;padding:0;background:transparent">
  <button id="sample">サンプル読込</button>
  <button id="saveJson">JSON保存</button>
  <button id="loadJson">JSON読込</button>
  <button id="print">印刷</button>
  <input id="file" type="file" accept=".json,application/json" hidden>
</div>
</header>

<!-- 組織の切り替え・管理バー -->
<div class="org-switcher no-print">
  <span style="color:var(--gold);font-weight:bold;white-space:nowrap;">組織：</span>
  <select id="orgSelect" style="flex:1;min-width:130px;"></select>
  <button id="newOrg" class="primary">新規</button>
  <button id="renameOrg">名前変更</button>
  <button id="deleteOrg" class="danger">削除</button>
</div>

<div class="layout">
  <!-- 操作ツールバー -->
  <div class="toolbar no-print">
    <button class="primary" id="addChild">＋ 子分追加</button>
    <button id="addSibling">＋ 同格追加</button>
    <button class="danger" id="delete">破門・削除</button>
  </div>

  <!-- 編集パネル -->
  <aside class="panel sidebar no-print">
    <h3 style="margin:0 0 6px 0;font-size:14px;color:var(--gold)">構成員の編集</h3>
    <div style="font-size:12px;color:var(--muted);background:#0f1117;padding:6px 8px;border-radius:4px;border:1px solid var(--border)" id="selectedLabel">選択：なし</div>

    <label for="nodeRole">役職・盃（例：若頭）</label>
    <input id="nodeRole" maxlength="50" placeholder="若頭">

    <label for="nodeName">氏名・団体名</label>
    <input id="nodeName" maxlength="50" placeholder="氏名または組織名">

    <label for="nodeDept">縄張り・シノギ・備考</label>
    <input id="nodeDept" maxlength="80" placeholder="例：歓楽街">

    <button class="primary" id="apply" style="width:100%;margin-top:12px;padding:10px">変更を反映する</button>
    <div class="status" id="status"></div>
  </aside>

  <!-- 組織図（編集パネルの下） -->
  <div class="canvas-wrap">
    <div class="canvas-header">
      <span id="count">総勢 1名</span>
      <div style="display:flex;gap:4px;align-items:center;">
        <button id="zoomOut" style="padding:4px 8px;font-size:12px;">−</button>
        <button id="zoomReset" style="padding:4px 8px;font-size:12px;">100%</button>
        <button id="zoomIn" style="padding:4px 8px;font-size:12px;">＋</button>
        <button id="expandModal" style="font-size:11px;padding:4px 8px;background:#222;color:var(--gold);border:1px solid var(--gold);margin-left:4px;">🔍 全画面で見る</button>
      </div>
    </div>
    <div class="canvas" id="mainCanvas">
      <div class="tree" id="tree"></div>
    </div>
    <div class="meta-info">
      <span style="font-size:10px;color:var(--muted)">※余白をタップするか「全画面で見る」で大きく表示できます</span>
    </div>
  </div>
</div>
</div>

<!-- フルスクリーン・モーダル -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-header">
    <span style="font-size:13px;color:var(--gold);font-weight:bold;">◆ 全画面表示 ◆</span>
    <div class="modal-zoom-controls">
      <button id="modalZoomOut">縮小 −</button>
      <button id="modalZoomReset">100%</button>
      <button id="modalZoomIn">拡大 ＋</button>
      <button id="closeModal" style="background:var(--crimson);color:#fff;border:0;font-weight:bold;margin-left:6px;">閉じる ✕</button>
    </div>
  </div>
  <div class="modal-body" id="modalBody">
    <div class="tree" id="modalTree"></div>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);

const STORAGE_KEY_LIST="yakuza_org_list_v3";
const STORAGE_PREFIX="yakuza_org_data_v3";

const defaultOrgId="org_default_1";
const defaultOrgName="二代目黒鉄組（サンプル）";
const defaultRoot={
  id:1,
  name:"黒鉄 厳蔵",
  role:"二代目黒鉄組 組長",
  dept:"総本部（神室町）",
  children:[
    {
      id:2,name:"陣内 宗介",role:"若頭 / 陣内組",dept:"執行部・港湾利権",
      children:[
        {id:5,name:"冴島 剛",role:"若頭補佐",dept:"武闘派",children:[]},
        {id:6,name:"氷室 怜司",role:"若頭補佐",dept:"金融・フロント",children:[]}
      ]
    },
    {
      id:3,name:"九条 勝",role:"舎弟頭",dept:"渉外担当",
      children:[]
    }
  ]
};

let orgList = [];
let currentOrgId = defaultOrgId;
let root = JSON.parse(JSON.stringify(defaultRoot));
let selected = 1;
let nextId = 7;
let zoom = 1;
let modalZoom = 1;

function initStorage(){
  try{
    const savedList = localStorage.getItem(STORAGE_KEY_LIST);
    if(savedList) orgList = JSON.parse(savedList);
  }catch(e){}

  if(!orgList.length){
    orgList = [{ id: defaultOrgId, name: defaultOrgName }];
    localStorage.setItem(STORAGE_KEY_LIST, JSON.stringify(orgList));
    localStorage.setItem(STORAGE_PREFIX + defaultOrgId, JSON.stringify(defaultRoot));
  }
  currentOrgId = orgList[0].id;
  loadOrgData(currentOrgId);
}

function saveOrgList(){
  localStorage.setItem(STORAGE_KEY_LIST, JSON.stringify(orgList));
}

function saveCurrentOrgData(){
  localStorage.setItem(STORAGE_PREFIX + currentOrgId, JSON.stringify({root, nextId}));
}

function loadOrgData(id){
  currentOrgId = id;
  const raw = localStorage.getItem(STORAGE_PREFIX + id);
  if(raw){
    try{
      const data = JSON.parse(raw);
      root = data.root;
      nextId = data.nextId || (Math.max(...flatten(root).map(n=>n.id))+1);
    }catch(e){
      root = JSON.parse(JSON.stringify(defaultRoot));
      nextId = 7;
    }
  }else{
    root = { id:1, name:"新・組長", role:"組長", dept:"本家", children:[] };
    nextId = 2;
  }
  selected = root.id;
  updateOrgSelectUI();
  sync();
  draw();
}

function updateOrgSelectUI(){
  const sel = $("orgSelect");
  sel.innerHTML = "";
  orgList.forEach(org=>{
    const opt = document.createElement("option");
    opt.value = org.id;
    opt.textContent = org.name;
    if(org.id === currentOrgId) opt.selected = true;
    sel.append(opt);
  });
}

$("orgSelect").onchange = e => {
  saveCurrentOrgData();
  loadOrgData(e.target.value);
  status("組織を切り替えました");
};

$("newOrg").onclick = () => {
  const name = prompt("新しい組織名を入力してください：", "白虎会");
  if(!name || !name.trim()) return;

  saveCurrentOrgData();
  const newId = "org_" + Date.now();
  orgList.push({ id: newId, name: name.trim() });
  saveOrgList();

  root = { id: 1, name: "初代 " + name.trim(), role: "組長", dept:"本家", children: [] };
  nextId = 2;
  selected = 1;

  saveCurrentOrgData();
  updateOrgSelectUI();
  sync();
  draw();
  status("新組織「" + name.trim() + "」を作成しました");
};

$("renameOrg").onclick = () => {
  const org = orgList.find(o => o.id === currentOrgId);
  if(!org) return;
  const newName = prompt("組織名を変更：", org.name);
  if(!newName || !newName.trim()) return;
  org.name = newName.trim();
  saveOrgList();
  updateOrgSelectUI();
  status("組織名を変更しました");
};

$("deleteOrg").onclick = () => {
  if(orgList.length <= 1){
    alert("最後の組織は削除できません。");
    return;
  }
  const org = orgList.find(o => o.id === currentOrgId);
  if(!confirm(`「${org.name}」を削除しますか？`)) return;

  localStorage.removeItem(STORAGE_PREFIX + currentOrgId);
  orgList = orgList.filter(o => o.id !== currentOrgId);
  saveOrgList();
  loadOrgData(orgList[0].id);
  status("削除しました");
};

function find(n,id){
  if(n.id===id)return n;
  for(const c of n.children){
    const r=find(c,id);
    if(r)return r;
  }
  return null;
}

function parent(n,id){
  for(const c of n.children){
    if(c.id===id)return n;
    const r=parent(c,id);
    if(r)return r;
  }
  return null;
}

function flatten(n){
  return [n,...n.children.flatMap(flatten)];
}

function status(s){
  $("status").textContent=s;
}

function sync(){
  const n=find(root,selected)||root;
  selected=n.id;
  $("nodeName").value=n.name;
  $("nodeRole").value=n.role;
  $("nodeDept").value=n.dept;
  $("selectedLabel").textContent="選択："+n.name+"（"+(n.role||"役職なし")+"）";
  $("delete").disabled=n.id===root.id;
}

function render(n, isRoot=false){
  const branch=document.createElement("div");
  branch.className="branch";

  const card=document.createElement("div");
  card.className="node"+(isRoot?" root-node":"")+(n.id===selected?" selected":"");
  card.tabIndex=0;

  if(n.role){
    const role=document.createElement("div");
    role.className="role-badge";
    role.textContent=n.role;
    card.append(role);
  }

  const name=document.createElement("strong");
  name.textContent=n.name;
  card.append(name);

  if(n.dept){
    const dept=document.createElement("small");
    dept.textContent=n.dept;
    card.append(dept);
  }

  card.onclick=e=>{
    e.stopPropagation();
    selected=n.id;
    sync();
    draw();
  };

  branch.append(card);

  if(n.children.length){
    const line=document.createElement("div");
    line.className="connector";
    branch.append(line);

    const kids=document.createElement("div");
    kids.className="children";
    n.children.forEach(c=>kids.append(render(c, false)));
    branch.append(kids);
  }

  return branch;
}

function applyZoom(){
  $("tree").style.zoom = zoom;
  $("zoomReset").textContent = Math.round(zoom * 100) + "%";
  $("modalTree").style.zoom = modalZoom;
  $("modalZoomReset").textContent = Math.round(modalZoom * 100) + "%";
}

function draw(){
  $("tree").replaceChildren(render(root, true));
  $("modalTree").replaceChildren(render(root, true));
  applyZoom();

  $("count").textContent="総勢 "+flatten(root).length+" 名・団体";
  saveCurrentOrgData();
}

// 通常画面のズーム操作
$("zoomIn").onclick=()=>{ zoom=Math.min(1.8, +(zoom+.1).toFixed(1)); applyZoom(); };
$("zoomOut").onclick=()=>{ zoom=Math.max(.4, +(zoom-.1).toFixed(1)); applyZoom(); };
$("zoomReset").onclick=()=>{ zoom=1; applyZoom(); };

// 全画面モーダルのズーム操作
$("modalZoomIn").onclick=()=>{ modalZoom=Math.min(2.0, +(modalZoom+.15).toFixed(2)); applyZoom(); };
$("modalZoomOut").onclick=()=>{ modalZoom=Math.max(.3, +(modalZoom-.15).toFixed(2)); applyZoom(); };
$("modalZoomReset").onclick=()=>{ modalZoom=1; applyZoom(); };

// フルスクリーン開閉
$("expandModal").onclick = () => { $("modalOverlay").classList.add("active"); };
$("closeModal").onclick = () => { $("modalOverlay").classList.remove("active"); };
$("mainCanvas").onclick = (e) => {
  if(e.target === $("mainCanvas") || e.target.classList.contains('tree')){
    $("modalOverlay").classList.add("active");
  }
};

function add(sibling){
  const current=find(root,selected);
  const target=sibling?parent(root,selected):current;

  if(!target){
    status("本家（トップ）と同格は追加できません");
    return;
  }

  const n={
    id:nextId++,
    name:"新構成員",
    role:"若衆",
    dept:"担当・シノギ",
    children:[]
  };

  target.children.push(n);
  selected=n.id;
  sync();
  draw();
  $("nodeName").focus();
  $("nodeName").select();
  status("傘下を追加しました");
}

$("addChild").onclick=()=>add(false);
$("addSibling").onclick=()=>add(true);

$("apply").onclick=()=>{
  const n=find(root,selected);
  n.name=$("nodeName").value.trim()||"名称未設定";
  n.role=$("nodeRole").value.trim();
  n.dept=$("nodeDept").value.trim();
  sync();
  draw();
  status("保存しました");
};

$("delete").onclick=()=>{
  if(selected===root.id)return;
  if(!confirm("この構成員を破門・削除しますか？"))return;

  const p=parent(root,selected);
  p.children=p.children.filter(n=>n.id!==selected);
  selected=p.id;
  sync();
  draw();
  status("削除しました");
};

$("sample").onclick=()=>{
  if(!confirm("サンプル組織で上書きしますか？"))return;
  root = JSON.parse(JSON.stringify(defaultRoot));
  nextId = 7;
  selected = 1;
  sync();
  draw();
  status("サンプルを読み込みました");
};

$("saveJson").onclick=()=>{
  const org = orgList.find(o => o.id === currentOrgId);
  const blob=new Blob([JSON.stringify({orgName: org ? org.name : "org", root, nextId},null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=(org ? org.name : "yakuza") + "-chart.json";
  a.click();
  URL.revokeObjectURL(url);
  status("JSONファイルを保存しました");
};

$("loadJson").onclick=()=>$("file").click();

$("file").onchange=async e=>{
  const f=e.target.files[0];
  if(!f)return;
  try{
    const json=JSON.parse(await f.text());
    const v = json.root ? json.root : json;
    const importedOrgName = json.orgName || f.name.replace(/\.[^/.]+$/, "");

    root = v;
    nextId = Math.max(...flatten(v).map(n=>n.id))+1;
    selected = root.id;

    const newId = "org_" + Date.now();
    orgList.push({ id: newId, name: importedOrgName + " (読込)" });
    currentOrgId = newId;
    saveOrgList();
    updateOrgSelectUI();

    sync();
    draw();
    status("JSONを読み込みました");
  }catch{
    status("読み込み失敗：ファイル形式を確認してください");
  }
  e.target.value="";
};

$("print").onclick=()=>window.print();

initStorage();
})();
</script>
</body>
</html>
